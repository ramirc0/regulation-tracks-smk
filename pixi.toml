# Launcher: Snakemake with the pixi software-deployment and SLURM executor
# plugins. Rule envs live in their own workspace, workflow/envs/pixi.toml.
[workspace]
name = "regulation-tracks-smk"
channels = ["conda-forge"]
platforms = ["linux-64"]
exclude-newer = "7d"

[dependencies]
python = "3.13.*"
polars = "*"

[pypi-dependencies]
snakemake = { git = "https://github.com/snakemake/snakemake.git", rev = "5bf5e21b0d0e7e65e247c1f2c61c1a4f74a1a752" }
snakemake-software-deployment-plugin-pixi = { git = "https://github.com/cademirch/snakemake-software-deployment-plugin-pixi.git", rev = "315e0f3113daefc2dfeda3a48777cd1acb2707e0" }
snakemake-executor-plugin-slurm = { git = "https://github.com/snakemake/snakemake-executor-plugin-slurm.git", rev = "8c2af56eb7dd1e0b78866691d6981f1d8327e0db" }
snakemake-executor-plugin-slurm-jobstep = "==0.6.1"

[tasks]
test-freeze = "snakemake --snakefile workflow/Snakefile --directory .tests/integration --profile profiles/local --cores 2 --forceall freeze"
test = { cmd = "snakemake --snakefile workflow/Snakefile --directory .tests/integration --profile profiles/local --cores 2 --forceall", depends-on = ["test-freeze"] }
unit = "pixi run --manifest-path workflow/envs/pixi.toml --environment test pytest .tests/unit"
# Compares outputs with Gao's hub and the Registry lists on private paths.
reference = "pixi run --manifest-path workflow/envs/pixi.toml --environment test pytest .tests/reference"

[feature.lint.dependencies]
ruff = ">=0.16.9,<0.17"
numpydoc = ">=1.11.0,<2"

[feature.lint.tasks]
lint = "ruff check && ruff format --check && numpydoc lint workflow/scripts/*.py scripts/*.py"

[environments]
lint = { features = ["lint"], no-default-feature = true }

[exclude-newer]
ca-certificates = "0d"
certifi = "0d"
pip = "0d"

[pypi-exclude-newer]
certifi = "0d"
pip = "0d"
